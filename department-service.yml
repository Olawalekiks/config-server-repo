#
#server.port=8080
#eureka.instance.client.serverUrl.defaultZone=http://localhost:8761/eureka/

server:
  port: 8080

spring:
  boot:
    message: Hello, Department Service updated
  output:
    ansi:
      enabled: ALWAYS
  # application:
  #   name: department-service

  datasource:
    # JDBC URL syntax: jdbc:mysql://<HOST>:<PORT>/<DATABASE_NAME>
    url: "jdbc:mysql://localhost:3306/paymentengine3?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: root
    password: "Teejay345$"
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate Configuration
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        # Formats SQL queries across multiple lines for readability
        # format_sql: true

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %m%n"
  level:
    org:
      hibernate:
        SQL: DEBUG
        # Shows the actual parameter values bound to the '?' placeholders
        # orm:
        #   jdbc:
        #     bind: TRACE

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
